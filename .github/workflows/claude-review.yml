# Reusable Claude review (app-product-foundation/agent-ci#1): a gate job and one job per lane, each running the
# claude-review composite action. The lane jobs are written out rather than generated by a matrix
# so their check names stay fixed (`<caller job> / Claude review`, `<caller job> / Claude security
# review`) even when they are skipped; keep the two in step. Products call this from a thin workflow that owns the triggers;
# see README.md "Adopting it".
#
# The reviews are billed to the owner's Claude subscription, so they run only for non-draft,
# same-repository pull requests that `allowed-author` opened and pushed, and only when the caller
# passes CLAUDE_CODE_OAUTH_TOKEN. Without the token the gate reports a skip and no lane runs.
# Lanes use continue-on-error and a HOLD verdict does not fail them, so they never block a merge.
#
# The action ref below must point at a commit whose action/ and prompts/ trees equal this
# commit's; ci.yml checks it, and scripts/pin-action-ref.sh rewrites it.
name: Claude review

on:
  workflow_call:
    inputs:
      lanes:
        description: 'Lanes to run, as a JSON list: ["code","security"].'
        type: string
        default: '["code","security"]'
      product-skill:
        description: "Path to the product skill, for example .agents/skills/<product>-dev/SKILL.md."
        type: string
        default: ""
      product-prompt:
        description: "Optional product prompt with `## code`, `## security` and `## scope` sections."
        type: string
        default: .github/claude-review.md
      rules-ref:
        description: "Where AGENTS.md, the skill and the product prompt are read from: base or head."
        type: string
        default: base
      merge-verdict:
        description: "Append the merge verdict contract that agent-merge-check reads."
        type: boolean
        default: false
      allowed-author:
        description: "The only PR author and actor the reviews run for."
        type: string
        default: Kazy1014
      model:
        description: "Claude model."
        type: string
        default: claude-sonnet-5-5
      runner:
        description: 'runs-on value as JSON (a string or a list of labels), for example "ubuntu-latest".'
        type: string
        default: '"ubuntu-latest"'
      codebuild-project:
        description: "When set, run on the CodeBuild runner of this project instead of `runner`."
        type: string
        default: ""
      codebuild-image:
        description: "CodeBuild image label, used with codebuild-project."
        type: string
        default: arm-lambda-nodejs24
      timeout-minutes:
        description: "Lane timeout. 0 means 20, or 13 on CodeBuild (Lambda stops a build after 15 minutes)."
        type: number
        default: 0
      comment-language:
        description: "Language of the review comments: en or ja."
        type: string
        default: en
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN:
        description: "Claude Code OAuth token (`claude setup-token`). Without it the reviews skip."
        required: false

permissions: {}

jobs:
  gate:
    name: Claude review gate
    if: >-
      github.event_name == 'pull_request' &&
      !github.event.pull_request.draft &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.user.login == inputs.allowed-author &&
      github.actor == inputs.allowed-author
    runs-on: ${{ inputs.codebuild-project != '' && fromJSON(format('["codebuild-{0}-{1}-{2}","image:{3}","claude-review-gate"]', inputs.codebuild-project, github.run_id, github.run_attempt, inputs.codebuild-image)) || ((startsWith(inputs.runner, '[') || startsWith(inputs.runner, '"')) && fromJSON(inputs.runner) || inputs.runner) }}
    timeout-minutes: 5
    permissions: {}
    outputs:
      enabled: ${{ steps.token.outputs.enabled }}
    steps:
      - name: Check the lanes and CLAUDE_CODE_OAUTH_TOKEN
        id: token
        env:
          HAS_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN != '' }}
          LANES: ${{ inputs.lanes }}
        run: |
          python3 -I -c '
          import json, os, sys
          try:
              lanes = json.loads(os.environ["LANES"])
          except ValueError:
              lanes = None
          if not isinstance(lanes, list) or not lanes or not set(lanes) <= {"code", "security"}:
              print("::error title=Claude review::lanes must be a non-empty JSON list of \"code\" and \"security\", got " + os.environ["LANES"])
              sys.exit(1)
          '
          echo "enabled=$HAS_TOKEN" >> "$GITHUB_OUTPUT"
          if [ "$HAS_TOKEN" != true ]; then
            echo "::notice title=Claude review::CLAUDE_CODE_OAUTH_TOKEN is not set; skipping the reviews."
          fi

  code:
    name: Claude review
    needs: [gate]
    if: needs.gate.outputs.enabled == 'true' && contains(fromJSON(inputs.lanes), 'code')
    runs-on: ${{ inputs.codebuild-project != '' && fromJSON(format('["codebuild-{0}-{1}-{2}","image:{3}","claude-review-code"]', inputs.codebuild-project, github.run_id, github.run_attempt, inputs.codebuild-image)) || ((startsWith(inputs.runner, '[') || startsWith(inputs.runner, '"')) && fromJSON(inputs.runner) || inputs.runner) }}
    timeout-minutes: ${{ inputs.timeout-minutes > 0 && inputs.timeout-minutes || (inputs.codebuild-project != '' && 13 || 20) }}
    continue-on-error: true
    permissions:
      contents: read
      pull-requests: write # gh pr comment
      issues: read # gh issue view, for the merge verdict
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false # Claude reaches GitHub only through gh with the action's token

      # agent-ci action ref (content of v1.0.1); see the header.
      - uses: app-product-foundation/agent-ci/action/claude-review@4eb9d417e45e60712a34d84765550f98d97294a3 # v1.0.1
        with:
          lane: code
          claude-code-oauth-token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          product-skill: ${{ inputs.product-skill }}
          product-prompt: ${{ inputs.product-prompt }}
          rules-ref: ${{ inputs.rules-ref }}
          merge-verdict: ${{ inputs.merge-verdict }}
          model: ${{ inputs.model }}
          comment-language: ${{ inputs.comment-language }}

  security:
    name: Claude security review
    needs: [gate]
    if: needs.gate.outputs.enabled == 'true' && contains(fromJSON(inputs.lanes), 'security')
    runs-on: ${{ inputs.codebuild-project != '' && fromJSON(format('["codebuild-{0}-{1}-{2}","image:{3}","claude-review-security"]', inputs.codebuild-project, github.run_id, github.run_attempt, inputs.codebuild-image)) || ((startsWith(inputs.runner, '[') || startsWith(inputs.runner, '"')) && fromJSON(inputs.runner) || inputs.runner) }}
    timeout-minutes: ${{ inputs.timeout-minutes > 0 && inputs.timeout-minutes || (inputs.codebuild-project != '' && 13 || 20) }}
    continue-on-error: true
    permissions:
      contents: read
      pull-requests: write # gh pr comment
      issues: read # gh issue view, for the merge verdict
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false # Claude reaches GitHub only through gh with the action's token

      # agent-ci action ref (content of v1.0.1); see the header.
      - uses: app-product-foundation/agent-ci/action/claude-review@4eb9d417e45e60712a34d84765550f98d97294a3 # v1.0.1
        with:
          lane: security
          claude-code-oauth-token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          product-skill: ${{ inputs.product-skill }}
          product-prompt: ${{ inputs.product-prompt }}
          rules-ref: ${{ inputs.rules-ref }}
          merge-verdict: ${{ inputs.merge-verdict }}
          model: ${{ inputs.model }}
          comment-language: ${{ inputs.comment-language }}
